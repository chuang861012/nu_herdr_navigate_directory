[package]
name = "nu_plugin_herdr_navigate_directory"
version = "0.1.1"
edition = "2024"
rust-version = "1.95.0"
license = "MIT"
description = "Nushell plugin that provides hnd, a Herdr-aware directory navigation command"
readme = "README.md"
authors = ["Henry Chuang"]
repository = "https://github.com/chuang861012/nu_herdr_navigate_directory"
keywords = ["nushell", "plugin", "herdr"]
categories = ["command-line-utilities"]

[dependencies]
nu-plugin = "0.115.0"
nu-protocol = "0.115.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
nu-plugin-core = "0.115.0"
nu-plugin-protocol = "0.115.0"
nu-protocol = "0.115.0"
